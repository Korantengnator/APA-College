name: Deploy to Firebase Hosting

# This workflow runs every time you push code to the 'dev' branch
on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Download your code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install project dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Step 4: Build the project (creates the frontend/dist folder)
      - name: Build project
        working-directory: frontend
        run: npm run build

      # Step 5: Install Firebase CLI on the server
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: apa-college-fc915
          workload_identity_provider: projects/187068651683/locations/global/workloadIdentityPools/github-hosting/providers/apa-college
          service_account: github-hosting-deploy@apa-college-fc915.iam.gserviceaccount.com
          token_format: access_token

      # Step 6: Deploy the built files to Firebase Hosting
      - name: Deploy to Firebase
        run: firebase deploy --only hosting --project apa-college-fc915 --non-interactive
