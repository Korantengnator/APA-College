name: Deploy to Firebase Hosting

# This workflow runs every time you push code to the 'dev' branch
on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install project dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Step 4: Build the project (creates the frontend/dist folder)
      - name: Build project
        working-directory: frontend
        run: npm run build

      # Step 5: Install Firebase CLI on the server
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 6: Deploy the built files to Firebase Hosting
      - name: Deploy to Firebase
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
